<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPE102 // Group C04 Lab Workbench (1/2026)</title>
  <meta name="description" content="CPE102 Engineering Exploration Studio Workbench by Group C04 — interactive 16-week archive, skill tracks, robot & capstone labs, and study checklists at KMUTT.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="data/site.js" defer></script>
  <script src="data/weeks-part1.js" defer></script>
  <script src="data/weeks-part2.js" defer></script>
  <script src="data/projects.js" defer></script>
  <script src="data/team-reflection.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="mobile-topbar">
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar">
      ☰
    </button>
    <a href="#overview" class="brand mobile-brand" data-nav-view="overview">
      <span class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>
      <span class="brand-text">
        <strong>CPE102</strong>
        <small>C04</small>
      </span>
    </a>
    <button type="button" class="theme-toggle" id="mobile-theme-toggle" aria-label="Switch light or dark theme" title="Toggle theme">
      <span class="theme-icon" aria-hidden="true">☾</span>
    </button>
  </header>

  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Workbench navigation">
      <div class="sidebar-top">
        <a href="#overview" class="brand" data-nav-view="overview">
          <span class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </span>
          <span class="brand-text">
            <strong>CPE102</strong>
            <small>C04 WORKBENCH</small>
          </span>
        </a>
        <div class="sidebar-meta">KMUTT · SEC C · SEM 1/2026</div>
      </div>

      <nav class="sidebar-nav" aria-label="Workspace views">
        <button type="button" class="nav-view-btn active" data-view="overview" aria-current="page">
          <span class="nav-idx">01</span>
          <span>Overview</span>
        </button>
        <button type="button" class="nav-view-btn" data-view="archive">
          <span class="nav-idx">02</span>
          <span>Weekly Archive</span>
          <span class="nav-badge">16</span>
        </button>
        <button type="button" class="nav-view-btn" data-view="projects">
          <span class="nav-idx">03</span>
          <span>Projects Lab</span>
          <span class="nav-badge">2</span>
        </button>
        <button type="button" class="nav-view-btn" data-view="team">
          <span class="nav-idx">04</span>
          <span>Retrospective &amp; Team</span>
        </button>
      </nav>

      <div class="sidebar-tracks" id="sidebar-tracks" aria-label="Quick track filters"></div>

      <div class="sidebar-bottom">
        <div class="study-progress-widget">
          <div class="sp-head">
            <span>EXAM PREP</span>
            <span id="review-counter">0/0</span>
          </div>
          <div class="sp-track">
            <div class="sp-fill" id="review-bar-fill"></div>
          </div>
        </div>

        <div class="sidebar-actions">
          <button type="button" class="theme-toggle sidebar-theme-btn" id="theme-toggle" aria-label="Switch light or dark theme">
            <span class="theme-icon" aria-hidden="true">☾</span>
            <span class="theme-label">Dark Mode</span>
          </button>
          <a href="https://github.com/tankritapath-jpg/C04_Viewbook" target="_blank" rel="noopener noreferrer" class="sidebar-repo-link">
            GitHub ↗
          </a>
        </div>
      </div>
    </aside>

    <main class="workspace" id="workspace">
      <section id="view-overview" class="view-panel active" role="region" aria-label="Overview"></section>
      <section id="view-archive" class="view-panel" role="region" aria-label="Weekly Archive" hidden></section>
      <section id="view-projects" class="view-panel" role="region" aria-label="Projects Lab" hidden></section>
      <section id="view-team" class="view-panel" role="region" aria-label="Retrospective and Team" hidden></section>
    </main>
  </div>

  <dialog id="lightbox" class="lightbox" aria-label="Photo viewer">
    <div class="lightbox-frame">
      <div class="lightbox-topbar">
        <span class="lightbox-counter" id="lightbox-counter">1 / 1</span>
        <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close photo viewer">×</button>
      </div>
      <div class="lightbox-stage" id="lightbox-stage"></div>
      <div class="lightbox-bottom">
        <button type="button" class="lightbox-nav" id="lightbox-prev" aria-label="Previous photo">‹ Prev</button>
        <div class="lightbox-meta">
          <div class="lightbox-title" id="lightbox-title"></div>
          <p class="lightbox-caption" id="lightbox-caption"></p>
        </div>
        <button type="button" class="lightbox-nav" id="lightbox-next" aria-label="Next photo">Next ›</button>
      </div>
    </div>
  </dialog>
</body>
</html>
